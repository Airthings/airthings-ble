name: Publish to PyPI and GitHub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New version tag, e.g. 1.3.0 or 1.3.0rc1
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-linting:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  build-publish:
    name: Build and publish to PyPI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: final-linting
    environment:
      name: release
      url: https://pypi.org/p/airthings-ble
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Validate tag
        id: tag
        run: |
          number='(0|[1-9][0-9]*)'
          if ! [[ "$TAG" =~ ^$number\.$number\.$number((a|b|rc)$number)?$ ]]; then
            echo "::error::'$TAG' is not a version like 1.3.0 or 1.3.0rc1"
            exit 1
          fi
          tag_check=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || tag_check=$?
          if [ "$tag_check" -eq 0 ]; then
            echo "::error::Tag $TAG already exists"
            exit 1
          elif [ "$tag_check" -ne 2 ]; then
            echo "::error::Could not check whether tag $TAG exists"
            exit 1
          fi
          pip install packaging
          python -c "
          import json, os, urllib.request
          from packaging.version import Version
          releases = json.load(urllib.request.urlopen('https://pypi.org/pypi/airthings-ble/json', timeout=30))['releases']
          latest = max(Version(v) for v in releases)
          if Version(os.environ['TAG']) <= latest:
            raise SystemExit(f'::error::{os.environ[\"TAG\"]} is not newer than {latest}, the latest on PyPI')
          "
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pyproject.toml Version
        run: |
          pip install tomlkit
          python -c "
          import os, tomlkit
          with open('pyproject.toml', 'r') as file:
            content = tomlkit.parse(file.read())
          content['project']['version'] = os.environ['TAG']
          with open('pyproject.toml', 'w') as file:
            file.write(tomlkit.dumps(content))
          "

      - name: Update __init__.py version
        run: |
          sed -i "s/__version__\\s*=\\s*[\"'].*[\"']/__version__ = \"$TAG\"/" airthings_ble/__init__.py

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - name: Install and import the built wheel
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/python -c "
          import importlib, os, pkgutil
          import airthings_ble
          assert airthings_ble.__version__ == os.environ['TAG'], airthings_ble.__version__
          for module in pkgutil.walk_packages(airthings_ble.__path__, 'airthings_ble.'):
            importlib.import_module(module.name)
          "

      - name: Commit, tag and push
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git add pyproject.toml airthings_ble/__init__.py
          git commit -m "Update version to $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          tag_name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
